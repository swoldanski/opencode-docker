name: opencode
services:
  opencode:
    image: ghcr.io/pilinux/opencode:1.2.5
    container_name: opencode

    # listen on all interfaces INSIDE the container
    command: opencode serve --hostname 0.0.0.0 --port 4096

    ports:
      - "4096:4096"

    volumes:
      - /opt/opencode/.local/share/opencode:/home/opencode/.local/share/opencode
      - /opt/opencode/.local/state/opencode:/home/opencode/.local/state/opencode
      - /opt/opencode/.config/opencode:/home/opencode/.config/opencode

    environment:
      - TZ=${TZ}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}

    restart: unless-stopped
